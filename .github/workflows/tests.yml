name: Tests and linting

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Test with pytest
        run: python -m pytest tests/ -v --tb=short -x

      - name: Verify imports
        run: python -c "from src import backtester, benchmarks, data_quality, pair_screener, risk_metrics, sensitivity, signals, trade_analysis, validation, walk_forward; print('All imports OK')"
